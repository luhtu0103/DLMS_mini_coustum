name: Build DLMS Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install PlatformIO
        run: |
          pip install -U platformio
      
      - name: Build Firmware
        run: |
          pio run
      
      - name: Upload Binary
        uses: actions/upload-artifact@v3
        with:
          name: dlms-firmware
          path: .pio/build/esp32s3/firmware.bin
