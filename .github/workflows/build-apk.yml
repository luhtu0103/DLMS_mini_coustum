name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'manifest.json'
      - 'icon-192.png'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'native-ble-entry.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build DLMS Mini APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check scripts/prepare-web.js
          node --check scripts/configure-android.js

      - name: Prepare web assets
        run: npm run build:web

      - name: Bundle native BLE plugin
        run: npx esbuild native-ble-entry.js --bundle --platform=browser --format=iife --global-name=DLMSNativeBLEBundle --outfile=www/native-ble-bundle.js

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android permissions
        run: node scripts/configure-android.js

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlms-mini-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
